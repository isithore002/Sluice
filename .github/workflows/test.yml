name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the version used locally, so `forge fmt --check` agrees with local formatting.
          version: v1.5.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Slither is installed on the runner, not run through crytic/slither-action: that action runs Slither inside a Docker
      # container where the Foundry installed above is not visible, so Slither cannot compile a Foundry project ("No such file
      # or directory: 'forge'"). Pinned to the version the findings in docs/SLITHER_TRIAGE.md were produced with.
      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      - name: Build
        run: forge build

      # Reports findings in the log and as a downloadable report, without failing the build on them (a crash still fails it).
      # Mocks, the demo helper, tests, scripts and libraries are filtered out.
      - name: Run Slither
        run: slither . --filter-paths "lib|test|script|mocks|demo" --no-fail-pedantic --json slither-report.json

      - name: Upload the Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: slither-report.json
          if-no-files-found: ignore
