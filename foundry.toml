[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Required by reactive-test-lib (omni branch): Omni pragma is ^0.8.29, the system
# contracts use transient storage (cancun), and the test engine needs via_ir.
solc_version = "0.8.29"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
# Deploy scripts record addresses in ./deployments; tests read the Morpho bytecode fixture.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./test/fixtures" },
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
lasna = "${LASNA_RPC}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[invariant]
runs = 256
depth = 60
# A reverting handler call means a user or a billed Reactive callback could fail: that must never happen.
fail_on_revert = true
